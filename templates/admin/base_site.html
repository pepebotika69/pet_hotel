{% extends "admin/base.html" %}
{% load i18n %}

{% block usertools %}
<div id="user-tools">
    <form action="/i18n/setlang/" method="post" style="display:inline; margin-right: 1em;">
        {% csrf_token %}
        <input name="next" type="hidden" value="{{ request.get_full_path }}">
        <select name="language" onchange="this.form.submit()" style="font-size: 0.8em; padding: 2px 4px;">
            {% get_available_languages as languages %}
            {% for lang_code, lang_name in languages %}
                <option value="{{ lang_code }}"{% if lang_code == LANGUAGE_CODE %} selected{% endif %}>
                    {{ lang_name }}
                </option>
            {% endfor %}
        </select>
    </form>
    {{ block.super }}
</div>
{% endblock %}
