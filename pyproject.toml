[tool.ruff]
target-version = "py311"
line-length = 119
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
    "DJ", # flake8-django
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "DJ001", # null=True on string-based fields (intentional design choice)
]

[tool.ruff.lint.isort]
known-first-party = ["pet_hotel"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
