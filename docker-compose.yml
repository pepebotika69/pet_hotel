---
version: "3.6"
services:

  db:
    image: "postgres:18.4-alpine"
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./pg_data_local:/var/lib/postgresql

  redis:
    image: "redis:8.10-alpine"
    container_name: cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: reverse_proxy
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      - web
      - admin

  web:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: pet_hotel_service
    #restart: unless-stopped
    volumes:
      - .:/opt/pet_hotel
    ports:
      - "${WEB_PORT}:8000"
    env_file: .env
    depends_on:
      - db
      - redis

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: pet_hotel_service_admin
    #restart: unless-stopped
    volumes:
      - .:/opt/pet_hotel
    ports:
      - "${ADMIN_PORT}:8000"
    env_file: .env
    depends_on:
      - db
      - redis
